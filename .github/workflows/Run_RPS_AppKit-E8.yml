name: Run on AppKit-E8 Hardware
on:
  workflow_dispatch:
  pull_request:
    branches: [v3]
  push:
    branches: [v3]

jobs:
  CI:
    runs-on: [self-hosted, rsp-p5-01]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Build Artifact
        uses: dawidd6/action-download-artifact@v17
        with:
          workflow: Build_RPS_AppKit-E8.yml
          name: RPS_AppKit-E8-U85_HIL_V3
          path: ./RockPaperScissors/AppKit-E8_USB/out

      - name: Flash and run using pyOCD
        working-directory: ./RockPaperScissors/AppKit-E8_USB/out
        run: |
          pyocd load --uid L96807771A --cbuild-run SDS+AppKit-E8-U85.cbuild-run.yml

      - name: Run using pyOCD
        working-directory: ./RockPaperScissors/AppKit-E8_USB/out
        run: |
          nohup pyocd run --uid L96807771A --cbuild-run SDS+AppKit-E8-U85.cbuild-run.yml --timelimit 100 --eot > pyocd.out 2>&1 &

      - name: Start the SDSIO-Sever
        working-directory: ./RockPaperScissors/AppKit-E8_USB
        run: | 
          sdsio-server --control SDS.sdsio.yml --playback --exit-after-playback --no-progress-info

      - name: Wait for pyocd to terminate
        run: |
          while pgrep pyocd > /dev/null; do
            sleep 1
          done

      - name: Show content of the pyocd.out file
        working-directory: ./RockPaperScissors/AppKit-E8_USB/out
        run: |
          cat ./pyocd.out

      - name: Upload SDS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sds-artifacts
          path: |
            RockPaperScissors/AppKit-E8_USB/algorithm/SDS Recordings/
            RockPaperScissors/AppKit-E8_USB/out/pyocd.out
            RockPaperScissors/AppKit-E8_USB/out/SDS+AppKit-E8-U85.SVDat
          if-no-files-found: warn
